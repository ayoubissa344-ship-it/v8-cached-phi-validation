name: V8 Resumable Loop Null-Predecessor Reproducer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: ${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: affected-diagnostic
            target_commit: aa7ac40507210f25ded5f29ccf182f8dcc1a0fd6
          - mode: fixed-regression
            target_commit: 075a5cc43e1c23df19a4b0dd57d3fdfc7a2fd0d8

    steps:
      - name: Checkout investigation repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          df -h

      - name: Install depot_tools
        run: |
          set -eux
          git clone --depth 1 \
            https://chromium.googlesource.com/chromium/tools/depot_tools.git \
            "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch V8 revision
        env:
          TARGET_COMMIT: ${{ matrix.target_commit }}
        run: |
          set -eux
          export PATH="$HOME/depot_tools:$PATH"
          fetch --no-history v8
          cd v8
          git fetch --no-tags origin "$TARGET_COMMIT"
          git checkout --detach "$TARGET_COMMIT"
          gclient sync -D
          git rev-parse HEAD | tee ../v8-commit.txt

      - name: Install regression test on affected revision
        if: matrix.mode == 'affected-diagnostic'
        working-directory: v8
        run: |
          set -eux
          cat > test/mjsunit/turbolev/escape-analysis-regress-561781465.js <<'JS'
          // Copyright 2026 the V8 project authors. All rights reserved.
          // Use of this source code is governed by a BSD-style license that can be
          // found in the LICENSE file.

          // Flags: --allow-natives-syntax --turbolev --turbolev-escape-analysis

          function* foo() {
            for (let i = 0; i < 4; i++) {
              const o = { y: "abc" };
              for (let j = 0; j < 5; j++) {
                o.y = {};
              }
              if (i < 1) {
                o.y = "def";
              }
              for (let k = 0; k < 2; k++) {
                for (let c = 0; c;) {
                  yield;
                }
              }
            }
          }

          %PrepareFunctionForOptimization(foo);
          foo().next();
          %OptimizeFunctionOnNextCall(foo);
          foo().next();
          JS

      - name: Instrument the exact null-predecessor condition
        if: matrix.mode == 'affected-diagnostic'
        working-directory: v8
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/maglev/turbolev-escape-analysis.cc")
          s = p.read_text()

          needle = (
              "      for (ValueNode* pred : predecessors) {\n"
              "        if (pred == nullptr) {\n"
          )
          if s.count(needle) != 1:
              raise SystemExit(
                  "PATCH_ABORTED: expected unique CreateSnapshotFor "
                  "predecessor loop"
              )

          insertion = (
              "          if (block->is_loop() && "
              "predecessors[0] != nullptr && block->has_state() &&\n"
              "              block->state()->is_resumable_loop()) {\n"
              '            CHECK(false) << '
              '"HYPOTHESIS_REPRODUCED_NULL_FIELD_PREDECESSOR";\n'
              "          }\n"
          )

          p.write_text(s.replace(needle, needle + insertion, 1))
          print("NULL_PREDECESSOR_INSTRUMENTATION=APPLIED")
          PY

          grep -n -A8 -B3 \
            'HYPOTHESIS_REPRODUCED_NULL_FIELD_PREDECESSOR' \
            src/maglev/turbolev-escape-analysis.cc

      - name: Test affected revision
        if: matrix.mode == 'affected-diagnostic'
        working-directory: v8
        run: |
          set -o pipefail
          set +e
          python3 tools/dev/gm.py x64.debug \
            mjsunit/turbolev/escape-analysis-regress-561781465 \
            2>&1 | tee ../resumable-loop.log
          status=${PIPESTATUS[0]}
          set -e

          if grep -q \
            'HYPOTHESIS_REPRODUCED_NULL_FIELD_PREDECESSOR' \
            ../resumable-loop.log; then
            echo "RESULT=HYPOTHESIS_REPRODUCED_ON_AFFECTED_REVISION"
            exit 0
          fi

          if [ "$status" -eq 0 ]; then
            echo "RESULT=HYPOTHESIS_NOT_REACHED_BY_REGRESSION_TEST"
            exit 1
          fi

          echo "RESULT=UNEXPECTED_TEST_OR_BUILD_FAILURE"
          exit "$status"

      - name: Test fixed revision
        if: matrix.mode == 'fixed-regression'
        working-directory: v8
        run: |
          set -o pipefail
          python3 tools/dev/gm.py x64.debug \
            mjsunit/turbolev/escape-analysis-regress-561781465 \
            2>&1 | tee ../resumable-loop.log
          echo "RESULT=FIXED_REVISION_REGRESSION_TEST_PASSED"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumable-loop-${{ matrix.mode }}
          path: |
            v8-commit.txt
            resumable-loop.log
          if-no-files-found: warn
